name: build-release

# Builds the Windows exe and the signed Android APK on GitHub, then publishes the release.
# Runs on a push to main that touches project.godot (the version lives there), or by hand
# (Actions -> build-release -> Run workflow). A release that already exists is never touched.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release if it does not exist yet (off = build and keep the files as an artifact)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [project.godot]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read the version
        id: ver
        run: |
          VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)
          NAME=$(grep -oP '^version/name="\K[^"]+' export_presets.cfg)
          CODE=$(grep -oP '^version/code=\K[0-9]+' export_presets.cfg)
          if [ "$VERSION" != "$NAME" ]; then
            echo "project.godot version ($VERSION) and export_presets.cfg version/name ($NAME) differ"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (Android version code $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Godot, its templates and the Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
            ~/Android/Sdk
          key: godot-${{ env.GODOT_VERSION }}-sdk-1

      - name: Install Godot, the export templates and the Android SDK
        run: |
          set -e
          if [ ! -x "$HOME/godot/godot" ]; then
            mkdir -p "$HOME/godot"
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d "$HOME/godot"
            mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$T/android_release.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/templates.tpz 'templates/windows_*_x86_64*.exe' 'templates/android_*.apk' 'templates/android_source.zip' 'templates/version.txt' -d "$T"
            rm -f /tmp/templates.tpz
          fi
          SDK="$HOME/Android/Sdk"
          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "build-tools;36.0.0" "platforms;android-35" "platforms;android-36"
          fi

      - name: Point Godot at Java and the Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$HOME/Android/Sdk"
          EOF

      - name: Import the project
        run: |
          "$HOME/godot/godot" --headless --path . --import

      - name: Export the Windows exe
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          "$HOME/godot/godot" --headless --path . --export-release "Windows Desktop" "out/Mera_Playable_v${V}_Windows.exe"
          test -s "out/Mera_Playable_v${V}_Windows.exe"

      - name: Export the signed Android APK
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -a; . assets/_keys/android/release.env; set +a
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$PWD/assets/_keys/android/mera-release.keystore"
          "$HOME/godot/godot" --headless --path . --export-release "Android" "out/Mera_Playable_v${V}_Android.apk"
          test -s "out/Mera_Playable_v${V}_Android.apk"
          rm -f out/*.idsig

      - name: Check the APK and write the checksums
        env:
          V: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          BT="$HOME/Android/Sdk/build-tools/36.0.0"
          "$BT/aapt2" dump badging "out/Mera_Playable_v${V}_Android.apk" | grep -q "versionCode='${CODE}' versionName='${V}'"
          "$BT/apksigner" verify --verbose "out/Mera_Playable_v${V}_Android.apk"
          cd out
          sha256sum "Mera_Playable_v${V}_Windows.exe" "Mera_Playable_v${V}_Android.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the files as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mera-playable-${{ steps.ver.outputs.version }}
          path: out/
          retention-days: 14

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${V}-playable"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Leaving it alone."
            exit 0
          fi
          awk -v t="## v${V}-playable" 'index($0,t)==1{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Build of ${V}." > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
            "out/Mera_Playable_v${V}_Windows.exe" "out/Mera_Playable_v${V}_Android.apk" out/SHA256SUMS.txt
