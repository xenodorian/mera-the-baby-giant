<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Soul Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
<style>
  :root { --bg:#0c0a10; --floor:#16121c; --wall:#221c30; --gold:#e2b04a; --fg:#f4efe6; --muted:#a89880; --soul:#8fd4ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Silkscreen, ui-monospace, monospace; }
  body { display:flex; flex-direction:column; min-height:100dvh; }
  header { display:flex; justify-content:space-between; gap:12px; padding:12px 16px; font-size:13px; }
  #souls { color:var(--soul); }
  #score { color:var(--gold); }
  .stage { position:relative; flex:1; min-height:0; }
  canvas { width:100%; height:100%; touch-action:none; display:block; }
  .veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(12,10,16,.8); padding:24px; }
  .card { width:min(100%, 28rem); border:1px solid rgba(226,176,74,.4); background:#221c30; padding:28px 24px; text-align:center; }
  h1 { margin:0; color:var(--gold); font-size:28px; font-weight:400; }
  p { line-height:1.5; }
  button.start { margin-top:18px; background:var(--gold); color:var(--bg); border:0; font:inherit; font-size:16px; padding:12px 22px; }
  .hint { color:var(--muted); font-size:12px; }
  .pad { display:grid; grid-template-columns:repeat(3, 4.5rem); gap:8px; justify-content:center; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .pad button { height:3.4rem; background:#221c30; color:var(--fg); border:0; font:inherit; font-size:18px; }
  .pad .gap { visibility:hidden; }
</style>
</head>
<body>
<header>
  <span>Soul Maze</span>
  <span id="souls">Souls 0/0</span>
  <span id="score">0</span>
</header>
<div class="stage">
  <canvas id="board"></canvas>
  <div class="veil" id="veil">
    <div class="card">
      <h1 id="title">Soul Maze</h1>
      <p id="blurb">Slip the reapers. Pocket the coins. The level ends when every soul fragment is yours.</p>
      <button class="start" id="go" type="button">Slip out</button>
      <p class="hint" id="hint">Arrows or WASD. Swipe the maze. A soul turns the reapers blue and they run.</p>
    </div>
  </div>
</div>
<div class="pad">
  <span class="gap"></span>
  <button type="button" data-x="0" data-y="-1" aria-label="Up">↑</button>
  <span class="gap"></span>
  <button type="button" data-x="-1" data-y="0" aria-label="Left">←</button>
  <button type="button" data-x="0" data-y="1" aria-label="Down">↓</button>
  <button type="button" data-x="1" data-y="0" aria-label="Right">→</button>
</div>

  Promise.all(ART.mera.map((b) => load("data:image/png;base64," + b))).then((v) => art.mera = v),
  Promise.all(ART.reaper.map((b) => load("data:image/png;base64," + b))).then((v) => art.reaper = v),
  Promise.all(ART.soul.map((b) => load("data:image/png;base64," + b))).then((v) => art.soul = v),
  load("data:image/png;base64," + ART.coin).then((v) => art.coin = v),
]);

function beep(freq, dur, type, gain) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(gain, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function unlock() {
  if (!audioCtx) audioCtx = new AudioContext();
  audioCtx.resume();
}
function showVeil() {
  const phase = sim.phase;
  const on = phase !== "play" && phase !== "dead";
  veil.hidden = !on;
  if (!on) return;
  title.textContent = phase === "won" ? "Souls taken" : phase === "over" ? "Caught" : "Soul Maze";
  blurb.textContent = phase === "won"
    ? "Every soul fragment is yours. The reapers lose the maze."
    : phase === "over"
      ? "A reaper got Mera before the last soul."
      : "Slip the reapers. Pocket the coins. The level ends when every soul fragment is yours.";
  go.textContent = phase === "ready" ? "Slip out" : "Run it again";
  hint.hidden = phase !== "ready";
}
function begin() {
  unlock();
  if (sim.phase === "won" || sim.phase === "over") Object.assign(sim, createSim());
  sim.phase = "play";
  showVeil();
}
go.addEventListener("click", begin);

function paint() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.floor(rect.width * dpr));
  const h = Math.max(1, Math.floor(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const tile = Math.min((w * 0.96) / COLS, (h * 0.96) / ROWS);
  const ox = (w - tile * COLS) / 2;
  const oy = (h - tile * ROWS) / 2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#0c0a10";
  ctx.fillRect(0,0,w,h);
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = sim.grid[y][x];
    const px = ox + x * tile, py = oy + y * tile;
    if (t === "#") {
      ctx.fillStyle = "#e2b04a";
      ctx.fillRect(px, py, tile + 0.5, tile + 0.5);
    } else {
      ctx.fillStyle = "#16121c";
      ctx.fillRect(px, py, tile + 0.5, tile + 0.5);
      if (t === "=") {
        ctx.fillStyle = "#e2b04a";
        ctx.globalAlpha = 0.85;
        ctx.fillRect(px + tile * 0.12, py + tile * 0.38, tile * 0.76, Math.max(2, tile * 0.16));
        ctx.globalAlpha = 1;
      }
    }
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = sim.grid[y][x];
    const cx = ox + (x + 0.5) * tile, cy = oy + (y + 0.5) * tile;
    if (t === "." && art.coin && art.coin.naturalWidth) {
      const s = tile * 0.32;
      ctx.drawImage(art.coin, cx - s/2, cy - s/2, s, s);
    } else if (t === ".") {
      ctx.fillStyle = "#e2b04a";
      ctx.beginPath(); ctx.arc(cx, cy, tile * 0.12, 0, Math.PI * 2); ctx.fill();
    } else if (t === "o") {
      const frame = art.soul[Math.floor(sim.anim * 12) % Math.max(1, art.soul.length)];
      const s = tile * 0.62;
      if (frame && frame.naturalWidth) ctx.drawImage(frame, cx - s/2, cy - s/2, s, s);
    }
  }
  for (const spark of sim.sparks) {
    ctx.globalAlpha = Math.max(0, spark.life * 3);
    ctx.fillStyle = spark.gold ? "#e2b04a" : "#8fd4ff";
    ctx.beginPath();
    ctx.arc(ox + (spark.x + 0.5) * tile, oy + (spark.y + 0.5) * tile, tile * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const g of sim.ghosts) {
    const frame = art.reaper[Math.floor(sim.anim * 8 + g.bob * 3) % Math.max(1, art.reaper.length)];
    const cx = Math.round(ox + (g.x + 0.5) * tile);
    const cy = Math.round(oy + (g.y + 0.5) * tile);
    const s = tile * (g.state === "eaten" ? 0.5 : 0.78);
    ctx.save();
    ctx.translate(cx, cy);
    if (g.dir.x < 0) ctx.scale(-1, 1);
    const flash = g.state === "fright" && sim.fright < 1 && Math.floor(sim.anim * 8) % 2 === 0;
    if (g.state === "fright" && !flash) ctx.filter = "brightness(0) saturate(100%) invert(13%) sepia(99%) saturate(7000%) hue-rotate(205deg) brightness(95%)";
    if (g.state === "eaten") ctx.globalAlpha = 0.4;
    if (frame && frame.naturalWidth) ctx.drawImage(frame, -s/2, -s/2, s, s);
    ctx.restore();
  }
  if (sim.phase !== "dead" || Math.sin(sim.anim * 24) > 0) {
    const frame = art.mera[sim.moving ? Math.floor(sim.anim * 10) % Math.max(1, art.mera.length) : 0];
    const cx = Math.round(ox + (sim.px + 0.5) * tile);
    const cy = Math.round(oy + (sim.py + 0.5) * tile);
    const s = tile * 0.78;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sim.facing, 1);
    if (sim.grace > 0 && Math.floor(sim.anim * 14) % 2 === 0) ctx.globalAlpha = 0.45;
    if (frame && frame.naturalWidth) ctx.drawImage(frame, -s/2, -s/2, s, s);
    ctx.restore();
  }
}

let last = performance.now();
let acc = 0;
let shown = "";
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += dt;
  let n = 0;
  while (acc >= 1/60 && n++ < 4) {
    const souls = sim.soulsLeft;
    const score = sim.score;
    step(sim, want, 1/60);
    acc -= 1/60;
    if (sim.score !== score || sim.soulsLeft !== souls) {
      if (sim.phase === "play" || sim.phase === "won") {
        if (sim.soulsLeft < souls) { beep(520, 0.12, "square", 0.04); beep(780, 0.18, "square", 0.03); }
        else beep(880, 0.05, "square", 0.03);
      }
    }
  }
  paint();
  const sig = sim.phase + "|" + sim.score + "|" + sim.soulsLeft;
  if (sig !== shown) {
    shown = sig;
    soulsEl.textContent = "Souls " + (sim.soulsTotal - sim.soulsLeft) + "/" + sim.soulsTotal;
    scoreEl.textContent = String(sim.score);
    showVeil();
    if (sim.phase === "over") beep(110, 0.28, "sawtooth", 0.05);
    if (sim.phase === "won") { beep(523, 0.14, "square", 0.04); beep(659, 0.18, "square", 0.04); beep(784, 0.28, "square", 0.04); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showVeil();

addEventListener("keydown", (e) => {
  const d = dirFromCode(e.code);
  if (!d) return;
  e.preventDefault();
  if (sim.phase === "ready" || sim.phase === "won" || sim.phase === "over") begin();
  want = d;
});
document.querySelectorAll(".pad button").forEach((btn) => {
  const dir = { x: Number(btn.dataset.x), y: Number(btn.dataset.y) };
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    if (sim.phase !== "play") begin();
    want = dir;
  });
  const up = () => { if (want && want.x === dir.x && want.y === dir.y) want = null; };
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
});
let swipe = null;
canvas.addEventListener("pointerdown", (e) => { swipe = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.hypot(dx, dy) < 24) return;
  if (sim.phase !== "play") begin();
  want = Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 };
});
</script>
</body>
</html>
