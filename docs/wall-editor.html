<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wall bench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
    <style>
      :root {
        --bg: #0c0a10;
        --floor: #16121c;
        --wall: #e2b04a;
        --fg: #f4efe6;
        --muted: #a89880;
        --surface: #221c30;
        --line: #3a3348;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: Silkscreen, ui-monospace, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        padding: 16px;
        gap: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }
      p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        max-width: 40rem;
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button.action {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        padding: 10px 12px;
        min-height: 44px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      button.action:hover { border-color: var(--wall); }
      .stage {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
      }
      .board {
        width: min(100%, calc((100dvh - 132px) * 16 / 9));
        aspect-ratio: 16 / 9;
        display: grid;
        grid-template-columns: repeat(23, 1fr);
        grid-template-rows: repeat(13, 1fr);
        gap: 2px;
        background: #100e16;
        padding: 2px;
        touch-action: none;
        user-select: none;
      }
      .cell {
        background: var(--floor);
        border: 0;
        padding: 0;
        min-width: 0;
        min-height: 0;
      }
      .cell.wall { background: var(--wall); }
      .cell.house { box-shadow: inset 0 0 0 2px var(--bg); }
      .cell.pen { background: var(--surface); }
      .cell.door {
        background: linear-gradient(to bottom, var(--floor) 34%, var(--wall) 34% 66%, var(--floor) 66%);
      }
      .cell.mouth { box-shadow: inset 0 -3px 0 var(--wall); }
      .cell.locked { cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Wall bench</h1>
        <p>23 × 13. Click or drag a tile to place or lift a wall. The ghost box stays put, door on top. <span id="count">0 walls</span></p>
      </div>
      <div class="actions">
        <button type="button" class="action" id="clear">Clear inside</button>
        <button type="button" class="action" id="copy">Copy layout</button>
      </div>
    </header>
    <div class="stage">
      <div class="board" id="board" role="grid" aria-label="Wall tiles"></div>
    </div>
    <script>
      const COLS = 23;
      const ROWS = 13;
      const KEY = "wall-bench";
      const board = document.getElementById("board");
      const countEl = document.getElementById("count");

      function houseTile(x, y) {
        if (x === 11 && y === 4) return ".";
        if (x < 9 || x > 13 || y < 5 || y > 8) return null;
        if (y === 5 && x === 11) return "=";
        if (y >= 6 && y <= 7 && x >= 10 && x <= 12) return "G";
        return "#";
      }

      function locked(x, y) {
        return houseTile(x, y) !== null;
      }

      function blank() {
        const grid = [];
        for (let y = 0; y < ROWS; y++) {
          const row = [];
          for (let x = 0; x < COLS; x++) {
            const house = houseTile(x, y);
            if (house) row.push(house);
            else if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) row.push("#");
            else row.push(".");
          }
          grid.push(row);
        }
        return grid;
      }

      function stamp(grid) {
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const house = houseTile(x, y);
            if (house) grid[y][x] = house;
          }
        }
        return grid;
      }

      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(KEY) || "null");
          if (!Array.isArray(raw) || raw.length !== ROWS) return blank();
          const grid = raw.map((row) => {
            if (!Array.isArray(row) || row.length !== COLS) throw new Error("bad");
            return row.map((cell) => {
              if (cell === true || cell === "#") return "#";
              if (cell === "=") return "=";
              if (cell === "G") return "G";
              return ".";
            });
          });
          return stamp(grid);
        } catch {
          return blank();
        }
      }

      let grid = load();
      let painting = null;

      function kind(x, y, tile) {
        if (tile === "=") return "door";
        if (tile === "G") return "pen";
        if (tile === "#") return locked(x, y) ? "house" : "wall";
        if (locked(x, y)) return "mouth";
        return "";
      }

      function save() {
        localStorage.setItem(KEY, JSON.stringify(grid));
        const walls = grid.flat().filter((tile) => tile === "#").length;
        countEl.textContent = walls + (walls === 1 ? " wall" : " walls");
      }

      function paint(x, y, tile) {
        if (locked(x, y) || grid[y][x] === tile) return;
        grid[y][x] = tile;
        const cell = board.querySelector(`[data-x="${x}"][data-y="${y}"]`);
        cell.className = "cell " + kind(x, y, tile) + (locked(x, y) ? " locked" : "");
        cell.setAttribute("aria-pressed", tile === "#" ? "true" : "false");
        save();
      }

      function cellFromPoint(event) {
        const el = document.elementFromPoint(event.clientX, event.clientY);
        const cell = el && el.closest ? el.closest("[data-x]") : null;
        if (!cell || !board.contains(cell)) return null;
        return [Number(cell.dataset.x), Number(cell.dataset.y)];
      }

      function caption(x, y, tile) {
        const where = `Row ${y + 1}, column ${x + 1}`;
        if (tile === "=") return where + ", ghost door";
        if (tile === "G") return where + ", ghost pen";
        if (locked(x, y)) return where + ", door mouth";
        return where + (tile === "#" ? ", wall" : ", floor");
      }

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const tile = grid[y][x];
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell " + kind(x, y, tile) + (locked(x, y) ? " locked" : "");
          cell.dataset.x = String(x);
          cell.dataset.y = String(y);
          cell.disabled = locked(x, y);
          cell.setAttribute("aria-pressed", tile === "#" ? "true" : "false");
          cell.setAttribute("aria-label", caption(x, y, tile));
          board.appendChild(cell);
        }
      }
      save();

      board.addEventListener("pointerdown", (event) => {
        const hit = cellFromPoint(event);
        if (!hit || locked(hit[0], hit[1])) return;
        event.preventDefault();
        board.setPointerCapture(event.pointerId);
        painting = grid[hit[1]][hit[0]] === "#" ? "." : "#";
        paint(hit[0], hit[1], painting);
      });
      board.addEventListener("pointermove", (event) => {
        if (painting === null || event.buttons === 0) return;
        const hit = cellFromPoint(event);
        if (hit) paint(hit[0], hit[1], painting);
      });
      function stopPaint() { painting = null; }
      board.addEventListener("pointerup", stopPaint);
      board.addEventListener("pointercancel", stopPaint);

      document.getElementById("clear").addEventListener("click", () => {
        grid = blank();
        board.querySelectorAll(".cell").forEach((cell) => {
          const x = Number(cell.dataset.x);
          const y = Number(cell.dataset.y);
          const tile = grid[y][x];
          cell.className = "cell " + kind(x, y, tile) + (locked(x, y) ? " locked" : "");
          cell.setAttribute("aria-pressed", tile === "#" ? "true" : "false");
        });
        save();
      });

      document.getElementById("copy").addEventListener("click", async () => {
        const text = grid.map((row) => row.join("")).join("\n");
        try {
          await navigator.clipboard.writeText(text);
          countEl.textContent = "Copied";
        } catch {
          countEl.textContent = "Copy failed";
        }
      });
    </script>
  </body>
</html>
